services:
  postgres:
    image: postgres:16
    container_name: vtn-postgres
    environment:
      POSTGRES_DB: vtn
      POSTGRES_USER: vtn
      POSTGRES_PASSWORD: vtn
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtn -d vtn"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: vtn-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
