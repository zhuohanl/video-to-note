[project]
name = "vtn-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi",
    "uvicorn",
    "vtn-core",
    "vtn-storage",
]

[tool.uv.sources]
vtn-core = { workspace = true }
vtn-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
