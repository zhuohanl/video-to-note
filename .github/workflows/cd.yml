name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: azd environment name
        required: true
        default: dev
      dry_run:
        description: Render deployment plan without provisioning/deploying
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AZURE_ENV_NAME: ${{ inputs.environment }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      VTN_USERNAME: ${{ vars.VTN_USERNAME }}
      VTN_PASSWORD: ${{ secrets.VTN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        if: inputs.dry_run == 'false'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
          pnpm install --frozen-lockfile

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Select azd environment
        if: inputs.dry_run == 'false'
        run: |
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" || azd env select "$AZURE_ENV_NAME"
          azd env set POSTGRES_ADMIN_PASSWORD "$POSTGRES_ADMIN_PASSWORD"
          azd env set VTN_USERNAME "${VTN_USERNAME:-local}"
          azd env set VTN_PASSWORD "$VTN_PASSWORD"

      - name: Render dry-run deployment plan
        if: inputs.dry_run == 'true'
        run: |
          az bicep build --file infra/main.bicep
          echo "Dry-run plan rendered: Bicep compiled and deployment workflow graph is valid."

      - name: Render Azure provision preview
        if: inputs.dry_run == 'false'
        run: azd provision --preview --no-prompt

      - name: Provision infrastructure
        if: inputs.dry_run == 'false'
        run: azd provision --no-prompt

      - name: Run migrations before deploy
        if: inputs.dry_run == 'false'
        run: bash infra/hooks/migrate.sh

      - name: Deploy services
        if: inputs.dry_run == 'false'
        run: azd deploy --no-prompt
