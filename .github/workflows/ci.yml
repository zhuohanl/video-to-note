name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vtn
          POSTGRES_USER: vtn
          POSTGRES_PASSWORD: vtn
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vtn -d vtn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports:
          - 10000:10000

    env:
      APP_PROFILE: fake
      DATABASE_URL: postgresql://vtn:vtn@127.0.0.1:55432/vtn
      TEST_DATABASE_URL: postgresql://vtn:vtn@127.0.0.1:55432/vtn
      AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
      VTN_USERNAME: local
      VTN_PASSWORD_HASH: $2b$04$KYVbZ5JFVfqu0oV98LnOD.DpEWiv9SPIfDEbfN/3KHD7dvjn/MT9K
      VTN_COOKIE_SECRET: ci-cookie-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Python lint
        run: uv run ruff check .

      - name: Python type check
        run: uv run mypy packages apps/api worker

      - name: Migrate test database
        run: uv run alembic upgrade head

      - name: Python tests
        run: uv run pytest -m "not real_infra" --cov=packages --cov=apps --cov=worker --cov-fail-under=85 -q

      - name: Web lint
        run: pnpm --dir apps/web lint

      - name: Web type check
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Web unit tests
        run: pnpm --dir apps/web test -- --coverage

      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Web e2e tests
        run: pnpm --dir apps/web e2e

      - name: Web build
        run: pnpm --dir apps/web build

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t vtn-api:ci .

      - name: Build worker image
        run: docker build -f worker/Dockerfile -t vtn-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t vtn-web:ci .
